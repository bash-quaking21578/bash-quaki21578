
name: APK Auto Upload 8h

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verifier Chrome
        run: |
          google-chrome --version || chromium --version || true

      - name: Installer les bibliotheques Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install DataRecorder DownloadKit DrissionPage requests

      - name: Verifier les installations
        run: |
          python -c "import DrissionPage, requests; print('Installations OK')"

      - name: Lancer le script d'upload
        run: |
          python -u upload3.py
